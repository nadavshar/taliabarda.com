name: Claude PR reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch PR diff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Fetching PR diff for $REPO PR #$PR_NUMBER"
          curl -s -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3.diff" "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER" > pr.diff || true
          echo "Saved diff (size $(wc -c < pr.diff) bytes)"

      - name: Call Anthropic Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_API_URL: ${{ secrets.ANTHROPIC_API_URL }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          API_URL=${ANTHROPIC_API_URL:-https://api.anthropic.com/v1/complete}
          MODEL=${ANTHROPIC_MODEL:-claude-2}

          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANThROPIC_API_KEY is not set. Create a repository secret named ANTHROPIC_API_KEY with your Anthropic API key."
            exit 1
          fi

          DIFF=$(sed 's/"/\\"/g' pr.diff | sed ':a;N;$!ba;s/\n/\\n/g')
          PROMPT="You are an expert code reviewer. Provide a concise, itemized code review for the following PR diff. Call out potential bugs, design issues, security problems, and improvement suggestions. Use bullets and keep each comment short.\n\n$DIFF"

          PAYLOAD=$(printf '{"model":"%s","prompt":"%s","max_tokens":800}' "$MODEL" "$PROMPT")

          echo "Calling Anthropic at $API_URL (model: $MODEL)"
          curl -s -X POST "$API_URL" \
            -H "Authorization: Bearer $ANTHROPIC_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" > anthropic_response.json || true

          echo "Anthropic response saved to anthropic_response.json (size $(wc -c < anthropic_response.json) bytes)"

      - name: Post comment to PR with Claude output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BODY_FILE=comment_body.md
          echo "## Automated review by Claude" > $BODY_FILE
          echo "" >> $BODY_FILE
          echo "The model output (raw) from Anthropic is below. You may wish to edit this before relying on it." >> $BODY_FILE
          echo "" >> $BODY_FILE
          echo '---' >> $BODY_FILE
          echo '```json' >> $BODY_FILE
          cat anthropic_response.json >> $BODY_FILE
          echo '```' >> $BODY_FILE

          # Use jq to safely JSON-encode the comment body
          curl -s -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            -d "{\"body\": $(jq -Rs '.' $BODY_FILE)}"