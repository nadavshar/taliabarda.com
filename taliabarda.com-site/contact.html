<body>

  <header class="site-header" data-header>
    <a class="site-logo" href="index.html" aria-label="Talia Barda — Home">Talia&nbsp;Barda</a>
    <button class="nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="nav-overlay" aria-label="Open menu">
      <span class="nav-toggle__line"></span>
      <span class="nav-toggle__line"></span>
    </button>
  </header>

  <nav class="nav-overlay" id="nav-overlay" data-nav-overlay aria-hidden="true">
    <ul class="nav-overlay__list">
      <li style="--i:0"><a href="works.html">Works</a></li>
      <li style="--i:1"><a href="collaborations.html">Collaborations</a></li>
      <li style="--i:2"><a href="teaching.html">Teaching</a></li>

    </ul>
    <p class="nav-overlay__footer">Talia Barda — Choreographer &amp; Dance Artist</p>
  </nav>

  <main class="page-main">
    <h1 class="page-title reveal">Contact</h1>
    <p class="page-intro reveal">For performances, collaborations and workshops — get in touch.</p>

    <div class="contact-grid reveal">
      <!-- ===== Direct details ===== -->
      <div class="contact-details">
        <p class="contact-details__label">Email</p>
        <a class="contact-details__value" href="mailto:hello@taliabarda.com">hello@taliabarda.com</a>

        <p class="contact-details__label">Instagram</p>
        <a class="contact-details__value" href="https://www.instagram.com/" target="_blank" rel="noopener">@taliabarda</a>
      </div>

      <!-- ===== Form —
           Powered by FormSubmit (formsubmit.co), no backend required.
           First submission sends a one-time confirmation link to the
           address below — click it once to activate delivery. Swap the
           email in the form action if hello@taliabarda.com isn't final. ===== -->
      <form class="form" action="https://formsubmit.co/hello@taliabarda.com" method="POST">
        <input type="hidden" name="_subject" value="New message from taliabarda.com">
        <input type="hidden" name="_captcha" value="false">
        <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required autocomplete="name">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="email">
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <button class="btn" type="submit">Send</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p class="site-footer__name">Talia Barda</p>
    <nav class="site-footer__nav" aria-label="Footer">
      <a href="mailto:hello@taliabarda.com">Email</a>
      <a href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram</a>
      <a href="contact.html">Contact</a>
    </nav>
    <p class="site-footer__copy">© <span data-year></span> Talia Barda</p>
  </footer>

  <script src="js/main.js"></script>
